<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111719" />
    <title>CaseCraft Studio</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111719; color: #edf1ee; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { width: min(680px, calc(100% - 40px)); margin: 0 auto; padding: 12vh 0 64px; }
      h1 { margin: 0; font-size: 28px; font-weight: 600; }
      p { margin: 10px 0 28px; color: #a9b4af; font-size: 14px; }
      nav { display: grid; gap: 10px; }
      a { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 20px; color: inherit; text-decoration: none; background: #192123; border: 1px solid #34413f; border-radius: 6px; }
      a:hover, a:focus-visible { border-color: #9bb7a5; background: #202b2b; outline: none; }
      a span:last-child { color: #a9b4af; }
      @media (max-width: 480px) { main { padding-top: 48px; } a { padding: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>CaseCraft Studio</h1>
      <p>Select an application</p>
      <nav aria-label="Applications">
        <a href="/design-studio/"><span>Design Studio</span><span aria-hidden="true">&#8594;</span></a>
        <a href="/mockup-studio/"><span>Phone Case Mockup Workflow</span><span aria-hidden="true">&#8594;</span></a>
      </nav>
    </main>
  </body>
</html>
